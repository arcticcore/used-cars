name: Bildata eller rättelse
description: Föreslå en bilmodell, uppdatering eller korrigering.
title: "[Bildata] "
body:
  - type: input
    id: vehicle
    attributes:
      label: Bil och motorvariant
      description: Märke, modell, generation, årsmodell och motorkod om känd.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Förslag eller rättelse
      description: Vad ska läggas till eller ändras? Skilj egna erfarenheter från dokumenterade uppgifter.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Källor
      description: Länkar och vad de stöder. Skriv om underlag saknas.
    validations:
      required: true
  - type: input
    id: model_year
    attributes:
      label: Modellår och marknad
      description: Ange modellår om känt, inte bara första registreringsår. Svensksåld eller importerad?
  - type: textarea
    id: scope
    attributes:
      label: Vilka exemplar gäller uppgiften?
      description: Motor, växellåda, kaross eller utrustning. Skriv vad som är okänt. Lägg inte in VIN, registreringsnummer eller personuppgifter.
